# Railway / Nixpacks.
# Node 18 has no util.styleText, and Vite refuses to build there.
# Ask the Node provider for 22, and install Node 22.23.4 when the image
# is older than 22.12 (Nixpacks' nodejs_22 has been 22.11.0).
# Dashboard variable, if you set one: NIXPACKS_NODE_VERSION=22

providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.setup]
nixPkgs = ["nodejs_22", "curl", "xz"]
cmds = ["bash scripts/use-node22.sh"]

[phases.install]
dependsOn = ["setup"]
cmds = [
  "if [ -x /opt/node22/bin/node ]; then export PATH=/opt/node22/bin:$PATH; fi",
  "node -v",
  "npm install --no-package-lock",
]

[phases.build]
dependsOn = ["install"]
cmds = [
  "if [ -x /opt/node22/bin/node ]; then export PATH=/opt/node22/bin:$PATH; fi",
  "node -v",
  "npm run build",
]

[start]
cmd = "if [ -x /opt/node22/bin/node ]; then export PATH=/opt/node22/bin:$PATH; fi; npm start"
